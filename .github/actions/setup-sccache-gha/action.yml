name: Setup sccache (GHA backend)
description: >-
  Installs the static sccache binary and points it at the GitHub Actions cache
  service directly (SCCACHE_GHA_ENABLED), so compilation objects are stored
  per-file with no tarball pack/upload step and no cache-key churn to manage.
  READ_ONLY mode on pull_request events keeps PR merge-ref scopes from writing
  throwaway entries; PRs still read the base branch's cache.
inputs:
  os:
    description: 'Runner label (used only for log clarity)'
    required: true
outputs:
  sccache-bin:
    description: 'Path to the sccache binary'
    value: ${{ steps.install-mac.outputs.sccache-bin || steps.install-win.outputs.sccache-bin }}
runs:
  using: composite
  steps:
    # sccache's GHA backend needs these two runner-service variables, which are
    # only exposed to actions (not steps) - github-script re-exports them.
    - name: Export GHA cache service tokens
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install sccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      id: install-mac
      run: |
        set -euo pipefail
        # Static binary: brew's ccache links zstd, which the deps build
        # uninstalls; sccache has no such issue.
        if [ "$(uname -m)" == "arm64" ]; then SCCACHE_ARCH=aarch64; else SCCACHE_ARCH=x86_64; fi
        mkdir -p "$RUNNER_TEMP/sccache-bin"
        curl -sSL "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-${SCCACHE_ARCH}-apple-darwin.tar.gz" \
          | tar xzf - -C "$RUNNER_TEMP/sccache-bin" --strip-components=1
        echo "sccache-bin=$RUNNER_TEMP/sccache-bin/sccache" >> "$GITHUB_OUTPUT"

    - name: Install sccache (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      id: install-win
      run: |
        choco install -y sccache
        echo "sccache-bin=sccache" >> $env:GITHUB_OUTPUT

    - name: Configure sccache environment
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "SCCACHE_GHA_ENABLED=on"
          # Bump to invalidate all sccache entries (e.g. after a toolchain change).
          echo "SCCACHE_GHA_VERSION=1"
          echo "SCCACHE_CACHE_SIZE=2G"
          echo "SCCACHE_IDLE_TIMEOUT=0"
        } >> "$GITHUB_ENV"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
        fi

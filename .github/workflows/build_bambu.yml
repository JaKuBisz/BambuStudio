on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: false
        type: string

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      barch-matrix: ${{ steps.set.outputs.barch-matrix }}
    steps:
      - id: set
        run: |
          # Universal macOS builds are split across two runners (one runner
          # per arch, each with its full vCPU set) and combined afterwards in
          # the package_universal job. Everything else builds in one job.
          if [ "${{ inputs.arch }}" == "universal" ]; then
            echo 'barch-matrix=["x86_64","arm64"]' >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.arch }}" ]; then
            echo 'barch-matrix=["${{ inputs.arch }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'barch-matrix=["native"]' >> "$GITHUB_OUTPUT"
          fi

  build_bambu:
    name: Build OpenStudio
    needs: prepare
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        barch: ${{ fromJSON(needs.prepare.outputs.barch-matrix) }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # No LFS objects in this repo (no .gitattributes) — skip git-lfs setup.

      - name: load cached deps
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Get the version and date on Ubuntu and macOS
        if: inputs.os != 'windows-latest'
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-latest'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SLIC3R_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

      # Compiler cache. Use the static sccache binary (brew's ccache links
      # zstd, which the deps workflow uninstalls; sccache has no such issue).
      - name: Cache compiler cache (macOS)
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ inputs.os }}-sccache-${{ matrix.barch }}-${{ github.sha }}
          restore-keys: |
            ${{ inputs.os }}-sccache-${{ matrix.barch }}-

      - name: Install sccache (macOS)
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        run: |
          if [ "$(uname -m)" == "arm64" ]; then SCCACHE_ARCH=aarch64; else SCCACHE_ARCH=x86_64; fi
          mkdir -p "$RUNNER_TEMP/sccache-bin"
          curl -sSL "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-${SCCACHE_ARCH}-apple-darwin.tar.gz" \
            | tar xzf - -C "$RUNNER_TEMP/sccache-bin" --strip-components=1
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=$RUNNER_TEMP/sccache-bin/sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$RUNNER_TEMP/sccache-bin/sccache" >> "$GITHUB_ENV"

      - name: Cache compiler cache (Linux)
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ inputs.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.os }}-ccache-

      - name: Install ccache (Linux)
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        run: |
          if ! command -v ccache >/dev/null; then sudo apt-get update && sudo apt-get install -y ccache; fi
          # Stats are cumulative across restored caches — zero them so the
          # end-of-job stats reflect THIS run only.
          ccache --zero-stats || true
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          # Allow caching of compilations that use precompiled headers (the
          # PCH content is hashed; it is byte-stable now that the volatile
          # build timestamp lives outside the PCH include chain).
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

  #   Mac
      - name: Build slicer mac
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          # CMake 4.x breaks legacy subprojects, so pin 3.31.0 — via the
          # official prebuilt binary (seconds), not brew extract which
          # compiles cmake from source (~8 min per job).
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-macos-universal.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.0-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          ./BuildMac.sh -s -x -a x86_64 -t 10.15
          "$RUNNER_TEMP/sccache-bin/sccache" --show-stats || true

      - name: Build slicer mac (${{ matrix.barch }})
        if: inputs.os == 'macos-15' || inputs.os == 'macos-26'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          # CMake 4.x breaks legacy subprojects, so pin 3.31.0 — via the
          # official prebuilt binary (seconds), not brew extract which
          # compiles cmake from source (~8 min per job).
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-macos-universal.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.0-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          ./BuildMac.sh -s -x -a ${{ matrix.barch }} -t 10.15
          "$RUNNER_TEMP/sccache-bin/sccache" --show-stats || true

      # Universal builds are packaged in the package_universal job instead.
      - name: pack mac dmg
        if: github.ref != 'refs/heads/main' && inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          # Only package the final .app bundle, not the whole raw CMake build
          # tree (object files, static libs, intermediate per-arch builds),
          # which previously bloated this artifact to ~2GB.
          APP_DIR="build/x86_64/BambuStudio"

          # Ad-hoc self-sign the app. This fork has no paid Apple Developer ID
          # certificate to notarize with, so Gatekeeper will still warn "Apple
          # could not verify this app is free of malware" on first launch.
          # Ad-hoc signing at least prevents "app is damaged" failures and
          # lets users get past the warning via right-click > Open (or
          # System Settings > Privacy & Security > Open Anyway, or
          # `xattr -cr OpenStudio.app` after downloading).
          codesign --force --deep --sign - "$APP_DIR/OpenStudio.app"

          DMG_NAME="OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_DIR/OpenStudio.app" "$STAGE_DIR/"
          cp scripts/macos/OpenStudio-First-Run.command "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "OpenStudio" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$STAGE_DIR"

      - name: Upload artifacts mac
        if: inputs.os == 'macos-15-intel'
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}
          path: ${{ github.workspace }}/OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg
          retention-days: 14

      # Universal builds: hand the per-arch .app bundle to package_universal.
      - name: Upload ${{ matrix.barch }} app bundle
        if: (inputs.os == 'macos-15' || inputs.os == 'macos-26') && inputs.arch == 'universal'
        working-directory: ${{ github.workspace }}
        run: tar -C "build/${{ matrix.barch }}/BambuStudio" -czf "app_${{ matrix.barch }}.tar.gz" OpenStudio.app

      - name: Upload app bundle artifact
        if: (inputs.os == 'macos-15' || inputs.os == 'macos-26') && inputs.arch == 'universal'
        uses: actions/upload-artifact@v6
        with:
          name: app-bundle-${{ matrix.barch }}
          path: ${{ github.workspace }}/app_${{ matrix.barch }}.tar.gz
          retention-days: 1

  # Windows
      # NOTE: back to the Visual Studio generator. Ninja+sccache was a dead
      # end: sccache cannot cache MSVC /Yu (PCH) compilations — and the PCH'd
      # targets are the bulk of the build — while disabling PCH breaks sources
      # that rely on PCH-transitive definitions (NOMINMAX etc.). msbuild
      # parallelizes fine (/m) and handles shared PDBs via /FS natively.
      - name: setup MSVC
        if: inputs.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Install nsis and pkgconfig
        if: inputs.os == 'windows-latest'
        run: |
          choco install nsis
          choco install pkgconfiglite

      - name: Build slicer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build
          cd build
          # Do NOT pass -DCMAKE_C/CXX_FLAGS here: it would clobber CMake's
          # default MSVC flags (/EHsc /GR /W3), and without /EHsc the STL
          # raises C4530, which /WX targets promote to errors (C2220).
          # SLIC3R_MSVC_PDB=0: CI ships no PDBs, and embedded debug info
          # would push libslic3r_gui.lib past the 4 GiB static-library
          # limit (LNK1248).
          cmake .. -G "Visual Studio 18 2026" -A X64 -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DSLIC3R_MSVC_PDB=0 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\build\BambuStudio_dep\usr\local" -DCMAKE_INSTALL_PREFIX="../install-dir" -DCMAKE_BUILD_TYPE=Release -DWIN10SDK_PATH="C:/Program Files (x86)/Windows Kits/10/Include/10.0.22000.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --target install --config Release -- -m
          # pwsh does NOT abort on native command failure — check explicitly.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # - name: Create installer Win
      #   if: inputs.os == 'windows-latest'
      #   working-directory: ${{ github.workspace }}/build
      #   run: |
      #     cpack -G NSIS

      - name: Pack app
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: |
          rem Give the zip a proper top-level folder (OpenStudio\) instead of
          rem install-dir\ — the portable-app convention, avoids scattering
          rem files when users extract into an existing directory.
          move install-dir OpenStudio
          "C:/Program Files/7-Zip/7z.exe" a -tzip OpenStudio_Windows_${{ env.ver }}_portable.zip OpenStudio

      # - name: Pack PDB
      #   if: inputs.os == 'windows-latest'
      #   working-directory: ${{ github.workspace }}/build/src/Release
      #   shell: cmd
      #   run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload artifacts Win zip
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_Windows_${{ env.ver }}_portable
          path: ${{ github.workspace }}/OpenStudio_Windows_${{ env.ver }}_portable.zip
          retention-days: 14


  # Ubuntu
      - name: Install dependencies from BuildLinux.sh
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build slicer
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: |
          # ubuntu-22.04 (GCC 11) produces non-reproducible .gch files, so the
          # PCH changes bytes every build and every PCH-consuming TU misses the
          # compiler cache. Disable PCH there so the build is fully cacheable.
          if [ "${{ inputs.os }}" == "ubuntu-22.04" ]; then
            export SLIC3R_EXTRA_CMAKE_ARGS="-DSLIC3R_PCH=OFF"
          fi
          ./BuildLinux.sh -isfr
          ccache --show-stats || true
          mv -n ./build/OpenStudio_ubu64.AppImage ./build/OpenStudio_${{inputs.os}}_${{ env.ver }}.AppImage

      # - name: Build orca_custom_preset_tests
      #   if: github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04'
      #   working-directory: ${{ github.workspace }}/build/src
      #   shell: bash
      #   run: |
      #     ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
      #     cd ${{ github.workspace }}/resources/profiles
      #     zip -r orca_custom_preset_tests.zip user/

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_${{inputs.os}}_${{ env.ver }}
          path: './build/OpenStudio_${{inputs.os}}_${{ env.ver }}.AppImage'
          retention-days: 14

      # - name: Deploy Ubuntu release
      #   if: ${{ ! env.ACT && github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04' }}
      #   uses: WebFreak001/deploy-nightly@v3.2.0
      #   with:
      #     upload_url: https://uploads.github.com/repos/SoftFever/OrcaSlicer/releases/137995723/assets{?name,label}
      #     release_id: 137995723
      #     asset_path: ./build/OrcaSlicer_Linux_${{ env.ver }}.AppImage
      #     asset_name: OrcaSlicer_Linux_${{ env.ver }}.AppImage
      #     asset_content_type: application/octet-stream
      #     max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

      # - name: Deploy orca_custom_preset_tests
      #   if: ${{ ! env.ACT && github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04' }}
      #   uses: WebFreak001/deploy-nightly@v3.2.0
      #   with:
      #     upload_url: https://uploads.github.com/repos/SoftFever/OrcaSlicer/releases/137995723/assets{?name,label}
      #     release_id: 137995723
      #     asset_path: ${{ github.workspace }}/resources/profiles/orca_custom_preset_tests.zip
      #     asset_name: orca_custom_preset_tests.zip
      #     asset_content_type: application/octet-stream
      #     max_releases: 1

  # Universal macOS builds: the two arch slices were built on separate
  # runners (build_bambu matrix); this job combines them via lipo and
  # packages the dmg.
  package_universal:
    name: Package universal macOS
    needs: [build_bambu]
    if: inputs.arch == 'universal'
    runs-on: ${{ inputs.os }}
    env:
      ver:
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get the version
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
        shell: bash

      - name: Download app bundles
        uses: actions/download-artifact@v6
        with:
          pattern: app-bundle-*
          path: ${{ github.workspace }}/artifacts

      - name: Combine universal binary
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          for A in x86_64 arm64; do
            mkdir -p "build/$A/BambuStudio"
            tar -C "build/$A/BambuStudio" -xzf "artifacts/app-bundle-$A/app_$A.tar.gz"
          done
          mkdir -p build/universal/BambuStudio
          rm -rf build/universal/BambuStudio/OpenStudio.app
          cp -R build/arm64/BambuStudio/OpenStudio.app build/universal/BambuStudio/OpenStudio.app
          lipo -create \
            build/x86_64/BambuStudio/OpenStudio.app/Contents/MacOS/OpenStudio \
            build/arm64/BambuStudio/OpenStudio.app/Contents/MacOS/OpenStudio \
            -output build/universal/BambuStudio/OpenStudio.app/Contents/MacOS/OpenStudio

      - name: pack mac dmg
        working-directory: ${{ github.workspace }}
        run: |
          APP_DIR="build/universal/BambuStudio"

          # Ad-hoc self-sign the app. This fork has no paid Apple Developer ID
          # certificate to notarize with, so Gatekeeper will still warn "Apple
          # could not verify this app is free of malware" on first launch.
          # Ad-hoc signing at least prevents "app is damaged" failures and
          # lets users get past the warning via right-click > Open (or
          # System Settings > Privacy & Security > Open Anyway, or
          # `xattr -cr OpenStudio.app` after downloading).
          codesign --force --deep --sign - "$APP_DIR/OpenStudio.app"

          DMG_NAME="OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_DIR/OpenStudio.app" "$STAGE_DIR/"
          cp scripts/macos/OpenStudio-First-Run.command "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "OpenStudio" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$STAGE_DIR"

      - name: Upload artifacts mac
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}
          path: ${{ github.workspace }}/OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg
          retention-days: 14

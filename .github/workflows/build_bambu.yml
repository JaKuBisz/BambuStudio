on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      barch-matrix: ${{ steps.set.outputs.barch-matrix }}
    steps:
      - id: set
        run: |
          # Universal macOS builds are split across two runners (one runner
          # per arch, each with its full vCPU set) and combined afterwards in
          # the package_universal job. Everything else builds in one job.
          if [ "${{ inputs.arch }}" == "universal" ]; then
            echo 'barch-matrix=["x86_64","arm64"]' >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.arch }}" ]; then
            echo 'barch-matrix=["${{ inputs.arch }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'barch-matrix=["native"]' >> "$GITHUB_OUTPUT"
          fi

  build_bambu:
    name: Build OpenStudio
    needs: prepare
    runs-on: ${{ inputs.os }}
    # App builds are cheap with a warm compiler cache, so a newer push may
    # cancel an older run's app jobs freely. Grouped per PR/ref + os + arch so
    # only the superseded legs are cancelled. Deps builds (in build_deps.yml)
    # deliberately use a separate, non-cancelling group.
    concurrency:
      group: app-${{ inputs.os }}-${{ inputs.arch }}-${{ matrix.barch }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        barch: ${{ fromJSON(needs.prepare.outputs.barch-matrix) }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # No LFS objects in this repo (no .gitattributes) — skip git-lfs setup.

      - name: Compute deps cache key
        id: deps-key
        uses: ./.github/actions/deps-cache-key
        with:
          os: ${{ inputs.os }}
          barch: ${{ matrix.barch }}

      - name: Restore cached deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.deps-key.outputs.cache-path }}
          key: ${{ steps.deps-key.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Get the version and date on Ubuntu and macOS
        if: inputs.os != 'windows-latest'
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "week=$(date +'%Y-%V')" >> $GITHUB_ENV
        shell: bash

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-latest'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SLIC3R_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

      # Compiler cache. macOS uses sccache's native GHA backend (per-object
      # storage via the cache service API — no tarball churn, no key
      # management, read-only on PRs). Windows uses the VS generator, which
      # ignores CMAKE_*_COMPILER_LAUNCHER, so no compiler cache there. Linux
      # uses ccache via actions/cache with a weekly-epoch key so entries
      # rotate instead of one entry per SHA (SHA-keyed entries wrote ~200 MB
      # per push per OS and evicted the far more expensive deps caches via LRU).
      - name: Setup sccache (macOS)
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        id: sccache
        uses: ./.github/actions/setup-sccache-gha
        with:
          os: ${{ inputs.os }}

      - name: Configure compiler launcher (macOS)
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=${{ steps.sccache.outputs.sccache-bin }}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=${{ steps.sccache.outputs.sccache-bin }}" >> "$GITHUB_ENV"

      - name: Restore ccache (Linux)
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ inputs.os }}-ccache-w${{ env.week }}
          restore-keys: |
            ${{ inputs.os }}-ccache-

      - name: Install ccache (Linux)
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        run: |
          if ! command -v ccache >/dev/null; then sudo apt-get update && sudo apt-get install -y ccache; fi
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          # Allow caching of compilations that use precompiled headers (the
          # PCH content is hashed; it is byte-stable now that the volatile
          # build timestamp lives outside the PCH include chain).
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          # Stats are cumulative across restored caches — zero them so the
          # end-of-job stats reflect THIS run only.
          ccache --zero-stats || true

  #   Mac
      - name: Build slicer mac
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          # CMake 4.x breaks legacy subprojects, so pin 3.31.0 — via the
          # official prebuilt binary (seconds), not brew extract which
          # compiles cmake from source (~8 min per job).
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-macos-universal.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.0-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          # awk passthrough: full output streams to the log; every 25th Ninja
          # [done/total] line also emits a ::notice so the run summary page
          # shows a timestamped progress trail (GHA has no native % progress).
          set -o pipefail
          ./BuildMac.sh -s -x -a x86_64 -t 10.15 2>&1 | awk '{ print } /^\[[0-9]+\/[0-9]+\]/ { if (++n % 25 == 0) print "::notice title=Build progress::" $0 }'
          "${{ steps.sccache.outputs.sccache-bin }}" --show-stats || true

      - name: Build slicer mac (${{ matrix.barch }})
        if: inputs.os == 'macos-15' || inputs.os == 'macos-26'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          # CMake 4.x breaks legacy subprojects, so pin 3.31.0 — via the
          # official prebuilt binary (seconds), not brew extract which
          # compiles cmake from source (~8 min per job).
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-macos-universal.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.0-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          # awk passthrough: full output streams to the log; every 25th Ninja
          # [done/total] line also emits a ::notice so the run summary page
          # shows a timestamped progress trail (GHA has no native % progress).
          set -o pipefail
          ./BuildMac.sh -s -x -a ${{ matrix.barch }} -t 10.15 2>&1 | awk '{ print } /^\[[0-9]+\/[0-9]+\]/ { if (++n % 25 == 0) print "::notice title=Build progress::" $0 }'
          "${{ steps.sccache.outputs.sccache-bin }}" --show-stats || true

      - name: pack mac dmg
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          # Only package the final .app bundle, not the whole raw CMake build
          # tree (object files, static libs, intermediate per-arch builds),
          # which previously bloated this artifact to ~2GB.
          APP_DIR="build/x86_64/BambuStudio"

          # Ad-hoc self-sign the app. This fork has no paid Apple Developer ID
          # certificate to notarize with, so Gatekeeper will still warn "Apple
          # could not verify this app is free of malware" on first launch.
          # Ad-hoc signing at least prevents "app is damaged" failures and
          # lets users get past the warning via right-click > Open (or
          # System Settings > Privacy & Security > Open Anyway, or
          # `xattr -cr OpenStudio.app` after downloading).
          codesign --force --deep --sign - "$APP_DIR/OpenStudio.app"

          DMG_NAME="OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_DIR/OpenStudio.app" "$STAGE_DIR/"
          cp scripts/macos/OpenStudio-First-Run.command "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "OpenStudio" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$STAGE_DIR"

      - name: Upload artifacts mac
        if: inputs.os == 'macos-15-intel'
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}
          path: ${{ github.workspace }}/OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg
          retention-days: 14

      # Universal builds: hand the per-arch .app bundle to package_universal.
      # The artifact name includes the OS: macos-15 and macos-26 legs run in
      # the same workflow run, and upload-artifact v4+ rejects duplicate names.
      - name: Upload ${{ matrix.barch }} app bundle
        if: (inputs.os == 'macos-15' || inputs.os == 'macos-26') && inputs.arch == 'universal'
        working-directory: ${{ github.workspace }}
        run: tar -C "build/${{ matrix.barch }}/BambuStudio" -czf "app_${{ inputs.os }}_${{ matrix.barch }}.tar.gz" OpenStudio.app

      - name: Upload app bundle artifact
        if: (inputs.os == 'macos-15' || inputs.os == 'macos-26') && inputs.arch == 'universal'
        uses: actions/upload-artifact@v6
        with:
          name: app-bundle-${{ inputs.os }}-${{ matrix.barch }}
          path: ${{ github.workspace }}/app_${{ inputs.os }}_${{ matrix.barch }}.tar.gz
          retention-days: 1

  # Windows
      # Ninja + sccache (GHA backend) + PCH off. History: Ninja itself always
      # worked — the two failures were /Z7 (LNK1248, fixed via
      # SLIC3R_MSVC_PDB=0) and a PCH-transitive NOMINMAX collision (fixed via
      # /DNOMINMAX in CMakeLists.txt). The VS generator cannot be
      # compiler-cached at all (ignores CMAKE_*_COMPILER_LAUNCHER, MSBuild
      # resolves cl.exe from the toolset dir), so Ninja is the only path to a
      # cached Windows build. PCH stays off: sccache can't cache MSVC /Yu.
      # FALLBACK: if more PCH-transitive compile errors surface, revert this
      # section to the VS generator (see dev's f02cf3fb).
      - name: setup MSVC toolchain
        if: inputs.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install nsis and pkgconfig
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis
          choco install pkgconfiglite

      - name: Setup sccache (Windows)
        if: inputs.os == 'windows-latest'
        id: sccache-win
        uses: ./.github/actions/setup-sccache-gha
        with:
          os: ${{ inputs.os }}

      - name: Configure compiler launcher (Windows)
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=${{ steps.sccache-win.outputs.sccache-bin }}" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=${{ steps.sccache-win.outputs.sccache-bin }}" >> $env:GITHUB_ENV

      - name: Build slicer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          mkdir build
          cd build
          # Do NOT pass -DCMAKE_C/CXX_FLAGS here: it would clobber CMake's
          # default MSVC flags (/EHsc /GR /W3), and without /EHsc the STL
          # raises C4530, which /WX targets promote to errors (C2220).
          # SLIC3R_MSVC_PDB=0: CI ships no PDBs, and embedded debug info
          # would push libslic3r_gui.lib past the 4 GiB static-library
          # limit (LNK1248). SLIC3R_PCH=OFF: sccache cannot cache MSVC /Yu.
          cmake .. -G Ninja -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DSLIC3R_MSVC_PDB=0 -DSLIC3R_PCH=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\build\BambuStudio_dep\usr\local" -DCMAKE_INSTALL_PREFIX="../install-dir" -DCMAKE_BUILD_TYPE=Release -DWIN10SDK_PATH="C:/Program Files (x86)/Windows Kits/10/Include/10.0.22000.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # ForEach-Object passthrough: full output streams to the log; every
          # 25th Ninja [done/total] line also emits a ::notice so the run
          # summary page shows a progress trail (GHA has no native % progress).
          $script:i = 0
          cmake --build . --target install 2>&1 | ForEach-Object {
            $_
            if ("$_" -match '^\[\d+/\d+\]') { $script:i++; if ($script:i % 25 -eq 0) { Write-Host "::notice title=Build progress::$_" } }
          }
          # pwsh does NOT abort on native command failure — check explicitly,
          # otherwise a failed build is masked by the stats command below.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --show-stats

      - name: Pack app
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: |
          rem Give the zip a proper top-level folder (OpenStudio\) instead of
          rem install-dir\ — the portable-app convention, avoids scattering
          rem files when users extract into an existing directory.
          move install-dir OpenStudio
          "C:/Program Files/7-Zip/7z.exe" a -tzip OpenStudio_Windows_${{ env.ver }}_portable.zip OpenStudio

      - name: Upload artifacts Win zip
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_Windows_${{ env.ver }}_portable
          path: ${{ github.workspace }}/OpenStudio_Windows_${{ env.ver }}_portable.zip
          retention-days: 14


  # Ubuntu
      - name: Install dependencies from BuildLinux.sh
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Setup mold linker
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        uses: rui314/setup-mold@v1

      - name: Build slicer
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        env:
          # mold via LDFLAGS: CMake picks up LDFLAGS at first configure for
          # EXE/SHARED/MODULE linker flags. -fuse-ld=mold is a drop-in
          # replacement for GNU ld and links this binary several times faster.
          LDFLAGS: -fuse-ld=mold
        run: |
          ld --version | head -1 || true
          # awk passthrough: full output streams to the log; every 25th Ninja
          # [done/total] line also emits a ::notice so the run summary page
          # shows a timestamped progress trail (GHA has no native % progress).
          set -o pipefail
          ./BuildLinux.sh -isfr 2>&1 | awk '{ print } /^\[[0-9]+\/[0-9]+\]/ { if (++n % 25 == 0) print "::notice title=Build progress::" $0 }'
          ccache --show-stats || true
          mv -n ./build/OpenStudio_ubu64.AppImage ./build/OpenStudio_${{inputs.os}}_${{ env.ver }}.AppImage

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_${{inputs.os}}_${{ env.ver }}
          path: './build/OpenStudio_${{inputs.os}}_${{ env.ver }}.AppImage'
          retention-days: 14

      # Save ccache only on events that may write to this ref's cache scope.
      # PR merge-ref caches are unreachable from dev/master, so saving there
      # just spends the 10 GB budget on entries nobody can read.
      - name: Save ccache (Linux)
        if: ${{ (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ inputs.os }}-ccache-w${{ env.week }}


  # Universal macOS builds: the two arch slices were built on separate
  # runners (build_bambu matrix); this job combines them via lipo and
  # packages the dmg.
  package_universal:
    name: Package universal macOS
    needs: [build_bambu]
    if: inputs.arch == 'universal'
    runs-on: ${{ inputs.os }}
    env:
      ver:
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get the version
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
        shell: bash

      - name: Download app bundles
        uses: actions/download-artifact@v6
        with:
          pattern: app-bundle-${{ inputs.os }}-*
          path: ${{ github.workspace }}/artifacts

      - name: Combine universal binary
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          for A in x86_64 arm64; do
            mkdir -p "build/$A/BambuStudio"
            tar -C "build/$A/BambuStudio" -xzf "artifacts/app-bundle-${{ inputs.os }}-$A/app_${{ inputs.os }}_$A.tar.gz"
          done
          mkdir -p build/universal/BambuStudio
          rm -rf build/universal/BambuStudio/OpenStudio.app
          cp -R build/arm64/BambuStudio/OpenStudio.app build/universal/BambuStudio/OpenStudio.app
          lipo -create \
            build/x86_64/BambuStudio/OpenStudio.app/Contents/MacOS/OpenStudio \
            build/arm64/BambuStudio/OpenStudio.app/Contents/MacOS/OpenStudio \
            -output build/universal/BambuStudio/OpenStudio.app/Contents/MacOS/OpenStudio

      - name: pack mac dmg
        working-directory: ${{ github.workspace }}
        run: |
          APP_DIR="build/universal/BambuStudio"

          # Ad-hoc self-sign the app. This fork has no paid Apple Developer ID
          # certificate to notarize with, so Gatekeeper will still warn "Apple
          # could not verify this app is free of malware" on first launch.
          # Ad-hoc signing at least prevents "app is damaged" failures and
          # lets users get past the warning via right-click > Open (or
          # System Settings > Privacy & Security > Open Anyway, or
          # `xattr -cr OpenStudio.app` after downloading).
          codesign --force --deep --sign - "$APP_DIR/OpenStudio.app"

          DMG_NAME="OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_DIR/OpenStudio.app" "$STAGE_DIR/"
          cp scripts/macos/OpenStudio-First-Run.command "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "OpenStudio" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$STAGE_DIR"

      - name: Upload artifacts mac
        uses: actions/upload-artifact@v6
        with:
          name: OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}
          path: ${{ github.workspace }}/OpenStudio_Mac_${{inputs.arch}}_${{inputs.os}}_${{ env.ver }}.dmg
          retention-days: 14

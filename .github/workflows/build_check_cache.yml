name: Check Cache

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean
  
jobs:
  check_cache: # determines if there is a cache and outputs variables used in caching process
    name: Check Cache
    # Run on ubuntu-latest regardless of target OS: hashFiles('deps/**') is
    # content-based and this repo has no .gitattributes, so the hash is
    # identical on every platform. This keeps the (scarce, slow-to-start)
    # macOS runner slots free for real builds.
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false' # only hashing deps/** here, no need to download LFS objects
        
      - name: set outputs
        id: set_outputs
        env:
          dep-folder-name: ${{ inputs.os == 'windows-latest' && '/BambuStudio_dep' || ((inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26') && '') || (inputs.os != 'macos-15-intel' && inputs.os != 'macos-15' && inputs.os != 'macos-26') && '/destdir' || '' }}
        run: |
          echo cache-key=${{ inputs.os }}-cache-bambustudio_deps-build-${{ hashFiles('deps/**') }} >> "$GITHUB_OUTPUT"
          # Relative path: resolved against the workspace of whichever runner
          # later restores the cache (this job itself runs on ubuntu-latest).
          echo cache-path=deps/build${{ env.dep-folder-name }} >> "$GITHUB_OUTPUT"
            
      - name: load cache
        id: cache_deps
        uses: actions/cache@v5
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true
        
  build_deps: # call next step
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/build_deps.yml
    with:
      cache-key: ${{ needs.check_cache.outputs.cache-key }}
      cache-path: ${{ needs.check_cache.outputs.cache-path }}
      valid-cache: ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
name: 'CD: Homebrew Cask'
run-name: "Homebrew update — ${{ inputs.version || 'latest' }}"

# Gated to manual dispatch: this repo currently has no HOMEBREW_TAP_TOKEN
# secret configured, so an automatic release trigger would fail on every
# release. Re-enable the `release: [released]` trigger once the secret exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.6.1)'
        required: true
        type: string

permissions: read-all

concurrency:
  group: cd-deploy-homebrew
  cancel-in-progress: false

jobs:
  homebrew-update:
    name: Update Homebrew Cask
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOMEBREW_TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}

    steps:
      - name: Fail fast when the tap token is missing
        if: env.HOMEBREW_TAP_TOKEN_SET == 'false'
        run: |
          echo "::error::HOMEBREW_TAP_TOKEN secret is not configured on this repository." >&2
          echo "::error::Add it under Settings > Secrets and variables > Actions, then re-run." >&2
          exit 1

      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          # audit (not block) to match the other deploy workflows — block mode
          # rejected the checkout connection to github.com even though it was
          # allow-listed, failing the deploy at the checkout step.
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "Version: ${{ inputs.version }}"

      - name: Get macOS asset checksum
        id: checksums
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Discover the universal dmg from the release assets instead of
          # hardcoding the runner label — the macOS runner matrix changes over
          # time (macos-15, macos-26, ...). The universal dmg lipo-combines
          # arm64 + x86_64, so one asset covers every Mac. When several exist,
          # pick the lowest runner version (broadest macOS compatibility).
          ASSET=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '[.assets[].name | select(test("^OpenStudio_Mac_universal_.*\\.dmg$"))] | sort | .[0] // empty')
          if [ -z "$ASSET" ]; then
            echo "::error::No OpenStudio_Mac_universal_*.dmg asset found on release ${TAG}" >&2
            exit 1
          fi
          URL="${BASE}/${ASSET}"
          echo "Selected asset: $ASSET"

          echo "URL=$URL" >> $GITHUB_ENV

          # Function to fetch asset with retries
          fetch_with_retry() {
            local url="$1"
            local desc="$2"
            local timeout=$((20*60)) # 20 minutes in seconds
            local interval=30
            local elapsed=0
            while true; do
              if output=$(curl -sLf "$url" 2>/dev/null) && [ -n "$output" ]; then
                echo "$output"
                return 0
              fi
              if (( elapsed >= timeout )); then
                echo "::error::Timeout downloading $desc from $url after ${timeout}s" >&2
                return 1
              fi
              echo "Waiting for $desc to become available... (elapsed ${elapsed}s)"
              sleep $interval
              (( elapsed += interval ))
            done
          }

          # Download and hash
          DATA=$(fetch_with_retry "$URL" "universal macOS DMG")
          SHA=$(echo "$DATA" | sha256sum | cut -d' ' -f1)

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew Cask via PR
        uses: mislav/bump-homebrew-formula-action@ccf2332299a883f6af50a1d2d41e5df7904dd769  # v4
        with:
          formula-name: bambu-studio
          formula-path: Casks/bambu-studio.rb
          homebrew-tap: ${{ github.repository_owner }}/homebrew-tap
          tag-name: v${{ steps.version.outputs.version }}
          download-url: ${{ steps.checksums.outputs.url }}
          commit-message: "update bambu-studio to {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

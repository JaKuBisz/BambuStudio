on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    runs-on: ${{ inputs.os }}
    env:
      date:
    steps:

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@v6
        # No LFS objects in this repo (no .gitattributes) — skip git-lfs setup.

      - name: load cached deps
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      # NOTE: the cache check job runs on ubuntu-latest, and cache entries are
      # versioned per-OS unless cross-OS archive is enabled — so for Windows
      # and macOS the check always reports a miss and this job always runs.
      # When the restore above nevertheless hits, every step below is skipped
      # and the job exits quickly (this also makes the job resilient to the
      # race where another run populates the cache between check and build).

      - name: setup dev on Windows
        if: (inputs.os == 'windows-latest') && steps.deps-cache.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Get the date on Ubuntu and macOS
        if: (inputs.os != 'windows-latest') && steps.deps-cache.outputs.cache-hit != 'true'
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the date on Windows
        if: (inputs.os == 'windows-latest') && steps.deps-cache.outputs.cache-hit != 'true'
        run: echo "date=$(Get-Date -Format 'yyyyMMdd')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
        shell: pwsh


      # Build Dependencies
      - name: Build on Windows
        if: (inputs.os == 'windows-latest') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
            choco install strawberryperl
            choco install pkgconfiglite
            mkdir ${{ github.workspace }}\deps\build
            mkdir ${{ github.workspace }}\deps\build\BambuStudio_dep
            cd "${{ github.workspace }}\deps\build"
            cmake ../ -G "Visual Studio 18 2026" -A x64 -DDESTDIR="./BambuStudio_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF
            msbuild /m ALL_BUILD.vcxproj

      - name: pack deps on Windows
        if: (inputs.os == 'windows-latest') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: Compress-Archive -Path "${{ github.workspace }}\deps\build\BambuStudio_dep\*" -DestinationPath "${{ github.workspace }}\deps\build\BambuStudio_dep_win64_${{ env.date }}_vs2022.zip"
        shell: pwsh
          
      - name: Fix python install error on mac
        if: (inputs.os == 'macos-15-intel') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
          sudo rm -rf /Library/Frameworks/Python.framework/
          brew install --force python3 && brew unlink python3 && brew unlink python3 && brew link --overwrite python3

      # Compiler cache. The brew ccache package links against zstd, which the
      # mac deps build uninstalls, so use the static sccache binary instead.
      - name: Cache compiler cache (macOS)
        if: (inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26') && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ inputs.os }}-sccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.os }}-sccache-

      - name: Install sccache (macOS)
        if: (inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26') && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          if [ "$(uname -m)" == "arm64" ]; then SCCACHE_ARCH=aarch64; else SCCACHE_ARCH=x86_64; fi
          mkdir -p "$RUNNER_TEMP/sccache-bin"
          curl -sSL "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-${SCCACHE_ARCH}-apple-darwin.tar.gz" \
            | tar xzf - -C "$RUNNER_TEMP/sccache-bin" --strip-components=1
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=$RUNNER_TEMP/sccache-bin/sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$RUNNER_TEMP/sccache-bin/sccache" >> "$GITHUB_ENV"

      - name: Cache compiler cache (Linux)
        if: (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ inputs.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.os }}-ccache-

      - name: Install ccache (Linux)
        if: (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v ccache >/dev/null; then sudo apt-get update && sudo apt-get install -y ccache; fi
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      
      - name: Free disk space
        if: (inputs.os == 'macos-15') && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          df -h
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -h

      - name: Build on Mac ${{ inputs.arch }}
        if: (inputs.os == 'macos-15-intel') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo nasm yasm x264
            brew uninstall --ignore-dependencies zstd
            # CMake 4.x breaks legacy deps, so pin 3.31.0 — but via the
            # official prebuilt binary (seconds) instead of brew extract,
            # which compiles cmake from source (~8 min per job).
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-macos-universal.tar.gz | tar xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/cmake-3.31.0-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
            ./BuildMac.sh -d -x -a x86_64 -t 10.15
            "$RUNNER_TEMP/sccache-bin/sccache" --show-stats || true
            for arch in x86_64; do
                (cd "${{ github.workspace }}/deps/build/${arch}" && \
                find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
            done
            brew install zstd
      
      - name: Build on Mac ${{ inputs.arch }}
        if: (inputs.os == 'macos-15' || inputs.os == 'macos-26') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo nasm yasm x264
            brew uninstall --ignore-dependencies zstd
            # CMake 4.x breaks legacy deps, so pin 3.31.0 — but via the
            # official prebuilt binary (seconds) instead of brew extract,
            # which compiles cmake from source (~8 min per job).
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-macos-universal.tar.gz | tar xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/cmake-3.31.0-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
            ./BuildMac.sh -d -x -a universal -t 10.15
            "$RUNNER_TEMP/sccache-bin/sccache" --show-stats || true
            for arch in arm64 x86_64; do
                (cd "${{ github.workspace }}/deps/build/${arch}" && \
                find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
            done
            brew install zstd

      - name: pack deps on Macos
        if: (inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}/deps
          tar -zcvf "BambuStudio_dep_mac_${{ inputs.arch }}_$(date +"%Y%m%d").tar.gz" build


      - name: Build on Ubuntu
        if: (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
            sudo ./BuildLinux.sh -ur
            sudo chown $USER -R ./
            ./BuildLinux.sh -dfr
            ccache --show-stats || true
            cd deps/build
            tar -czvf BambuStudio_dep_${{ inputs.os }}_$(date +"%Y%m%d").tar.gz destdir

      # Upload Artifacts
      - name: Upload Mac ${{ inputs.arch }} artifacts
        if: (inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26') && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_mac_${{ inputs.arch }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/BambuStudio_dep_mac_${{ inputs.arch }}*.tar.gz
          retention-days: 14

      - name: clean artifacts
        if: (inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26') && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: rm -rf ${{ github.workspace }}/deps/build/BambuStudio_dep_mac_${{ inputs.arch }}*.tar.gz

      - name: Upload Windows artifacts
        if: (inputs.os == 'windows-latest') && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_win64_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep*.zip
          retention-days: 14

      - name: Upload Ubuntu artifacts
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') && steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep_${{ inputs.os }}_*.tar.gz
          retention-days: 14

  build_Bambu:
    name: Build BambuStudio
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/build_bambu.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
    secrets: inherit
